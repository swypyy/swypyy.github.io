<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090711">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}Swypyy Blog</title>
  <link rel="icon" type="image/png" href="{{ '/assets/s-logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Swypyy home">
        <span class="wordmark-mark">S</span><span>WYPYY</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a class="active" href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/anonymous-chat.html' | relative_url }}">Anonymous Chat</a>
      </nav>
    </header>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Swypyy</span>
      <span>Built with curiosity. Published with Jekyll.</span>
    </footer>
  </div>
  <script src="{{ '/assets/blog.js' | relative_url }}" defer></script>
</body>
</html>

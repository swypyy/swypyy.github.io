<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swypyy Anonymous Blog</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#07060b] text-white min-h-screen p-6">

    <!-- Warning Modal -->
    <div id="warning-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full text-white shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-red-400">⚠️ Anonymous Drop Warning</h3>
            <p class="text-gray-300 text-sm leading-relaxed">
                You are entering an open, unmoderated anonymous drop zone. Content posted here is public, permanent, and unfiltered. Do you wish to proceed?
            </p>
            <div class="flex space-x-3 pt-2">
                <button onclick="goBack()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-200 py-2.5 rounded-xl font-medium transition">
                    Back
                </button>
                <button onclick="declineTerms()" class="flex-1 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-600/50 py-2.5 rounded-xl font-medium transition">
                    Decline
                </button>
                <button onclick="acceptTerms()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">
                    Accept
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto space-y-8">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-brand-light">Swypyy Anonymous Blog</h1>
            <a href="index.html" class="text-sm bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20 transition-all">← Home</a>
        </div>
        
        <!-- Post Submission Form -->
        <div class="bg-surface border border-white/10 p-6 rounded-2xl space-y-4 shadow-xl">
            <h2 class="text-xl font-semibold">Drop a Post (No Account Needed)</h2>
            <input type="text" id="author" placeholder="Your Name (Optional)" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple">
            <input type="text" id="title" placeholder="Post Title" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple">
            <textarea id="content" placeholder="Write anything you want..." rows="4" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple"></textarea>
            <button onclick="createPost()" class="w-full bg-brand-purple hover:bg-brand-glow text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-brand-purple/20">Publish Post</button>
        </div>

        <!-- Posts Feed -->
        <div id="posts-container" class="space-y-6">
            <p class="text-gray-400 text-center">Loading posts...</p>
        </div>
    </div>

    <script>
        // Your live Render backend URL
        const API_URL = 'https://anonymous-blogger-djqp.onrender.com';

        // Warning Modal Logic
        function acceptTerms() {
            document.getElementById('warning-modal').style.display = 'none';
            localStorage.setItem('warningAccepted', 'true');
        }

        function declineTerms() {
            alert('You must accept the terms to view anonymous drops.');
            window.location.reload();
        }

        function goBack() {
            window.history.back();
        }

        if (localStorage.getItem('warningAccepted') === 'true') {
            document.getElementById('warning-modal').style.display = 'none';
        }

        // Fetch Posts and their Comments
        async function fetchPosts() {
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                const posts = await res.json();
                const container = document.getElementById('posts-container');
                
                if (posts.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-6">No posts yet. Be the first to write something!</p>';
                    return;
                }

                container.innerHTML = '';
                for (let p of posts) {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'bg-surface border border-white/10 p-6 rounded-2xl space-y-4 shadow-lg';
                    postDiv.innerHTML = `
                        <div class="flex justify-between text-xs text-gray-400 font-mono">
                            <span>By: ${escapeHtml(p.author)}</span>
                            <span>${p.date}</span>
                        </div>
                        <h3 class="text-xl font-bold text-brand-light">${escapeHtml(p.title)}</h3>
                        <p class="text-gray-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(p.content)}</p>
                        
                        <!-- Comments Section -->
                        <div class="border-t border-white/10 pt-4 mt-4 space-y-3">
                            <h4 class="text-sm font-semibold text-gray-400">Comments</h4>
                            <div id="comments-${p.id}" class="space-y-2 text-sm">
                                <p class="text-gray-500 italic">Loading comments...</p>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <input type="text" id="comment-input-${p.id}" placeholder="Write an anonymous comment..." class="flex-1 bg-black/40 border border-white/10 px-3 py-2 rounded-xl text-sm text-white outline-none focus:border-brand-purple">
                                <button onclick="addComment(${p.id})" class="bg-brand-purple hover:bg-brand-glow px-4 py-2 rounded-xl text-sm font-medium transition">Reply</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(postDiv);
                    fetchComments(p.id);
                }
            } catch (e) {
                document.getElementById('posts-container').innerHTML = '<p class="text-red-400 text-center">Failed to load posts. Render server might be waking up.</p>';
            }
        }

        async function fetchComments(postId) {
            try {
                const res = await fetch(`${API_URL}/api/comments/${postId}`);
                const comments = await res.json();
                const container = document.getElementById(`comments-${postId}`);
                
                if (comments.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-xs italic">No comments yet. Be the first!</p>';
                    return;
                }

                container.innerHTML = comments.map(c => `
                    <div class="bg-black/30 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                        <span class="text-gray-200">${escapeHtml(c.text)}</span>
                        <span class="text-[10px] text-gray-500 font-mono">${c.time}</span>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById(`comments-${postId}`).innerHTML = '<p class="text-red-400 text-xs">Failed to load comments.</p>';
            }
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();

            if (!text) return;

            try {
                const res = await fetch(`${API_URL}/api/comments/${postId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (res.ok) {
                    input.value = '';
                    fetchComments(postId);
                } else {
                    alert('Error adding comment.');
                }
            } catch (err) {
                alert('Network error adding comment.');
            }
        }

        async function createPost() {
            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            if (!title || !content) {
                alert('Please fill out the title and content!');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, title, content })
                });

                if (res.ok) {
                    document.getElementById('author').value = '';
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                    fetchPosts();
                } else {
                    alert('Error publishing post.');
                }
            } catch (err) {
                alert('Network error. Render server might be waking up from sleep mode, please try again in a few seconds.');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchPosts();
    </script>
</body>
                    </html>

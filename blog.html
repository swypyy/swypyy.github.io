<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swypyy Anonymous Blog</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-void text-white min-h-screen relative flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-3xl mx-auto p-6 flex justify-between items-center border-b border-white/5">
        <h1 class="text-2xl sm:text-3xl font-bold text-brand-light tracking-wide">Swypyy Blog</h1>
        <a href="index.html" class="text-xs sm:text-sm bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20 transition-all">← Home</a>
    </header>

    <!-- Main Full-Screen Feed Section -->
    <main class="flex-1 w-full max-w-3xl mx-auto p-4 sm:p-6 space-y-4 pb-24">
        <div id="posts-container" class="space-y-4">
            <div class="text-center py-12 text-gray-400 animate-pulse">Loading posts...</div>
        </div>
    </main>

    <!-- Floating Action Button (+) in Bottom Right -->
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="openModal()" class="w-14 h-14 bg-brand-purple hover:bg-brand-glow text-white text-3xl font-bold rounded-full shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 shadow-brand-purple/50">
            +
        </button>
    </div>

    <!-- Pop-up Modal (Hidden by Default) -->
    <div id="post-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-surface border border-white/10 w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">Create Anonymous Post</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold px-2 py-1">&times;</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">YOUR NAME (OPTIONAL)</label>
                    <input type="text" id="author" placeholder="Anonymous" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple text-sm">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">POST TITLE</label>
                    <input type="text" id="title" placeholder="What's on your mind?" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple text-sm">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">CONTENT</label>
                    <textarea id="content" placeholder="Write anything you want..." rows="4" class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-purple text-sm"></textarea>
                </div>
                
                <p id="cooldown-notice" class="text-xs text-amber-400 text-center hidden"></p>

                <div class="flex gap-3 pt-2">
                    <button onclick="closeModal()" class="flex-1 bg-white/10 hover:bg-white/15 font-semibold py-3 rounded-xl transition-all text-sm">Cancel</button>
                    <button onclick="createPost()" class="flex-1 bg-brand-purple hover:bg-brand-glow text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-brand-purple/20 text-sm">Publish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'https://anonymous-blogger-djqp.onrender.com';
        let lastPostTime = 0;
        const COOLDOWN_TIME = 60 * 1000; // 1 minute in milliseconds

        function openModal() {
            const now = Date.now();
            const timeElapsed = now - lastPostTime;

            if (timeElapsed < COOLDOWN_TIME) {
                const secondsLeft = Math.ceil((COOLDOWN_TIME - timeElapsed) / 1000);
                alert(`Please wait ${secondsLeft} more seconds before posting again (1-minute limit).`);
                return;
            }

            document.getElementById('post-modal').classList.remove('hidden');
            document.getElementById('post-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('post-modal').classList.remove('flex');
            document.getElementById('post-modal').classList.add('hidden');
        }

        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                if (!res.ok) throw new Error('Failed to fetch');
                const posts = await res.json();
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<div class="text-center py-16 text-gray-400 bg-surface/50 border border-white/5 rounded-2xl">No posts yet. Tap the <b>+</b> button below to write the first one!</div>';
                    return;
                }

                container.innerHTML = posts.map(p => `
                    <div class="bg-surface border border-white/10 p-6 rounded-2xl space-y-2 shadow-lg">
                        <div class="flex justify-between text-xs text-gray-400 font-mono">
                            <span class="text-brand-light font-bold">By: ${escapeHtml(p.author || 'Anonymous')}</span>
                            <span>${p.date}</span>
                        </div>
                        <h3 class="text-xl font-bold text-white">${escapeHtml(p.title)}</h3>
                        <p class="text-gray-300 whitespace-pre-wrap leading-relaxed text-sm">${escapeHtml(p.content)}</p>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="text-center py-12 text-red-400 bg-surface/50 border border-white/5 rounded-2xl">Render server is waking up or offline. Please refresh in a moment.</div>';
            }
        }

        async function createPost() {
            const author = document.getElementById('author').value.trim();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!title || !content) {
                alert('Please fill out both the title and content fields!');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, title, content })
                });

                if (res.ok) {
                    // Record timestamp for 1-minute cooldown
                    lastPostTime = Date.now();

                    // Clear inputs and close modal
                    document.getElementById('author').value = '';
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                    closeModal();

                    // Refresh feed immediately
                    fetchPosts();
                } else {
                    alert('Error publishing post. Try again.');
                }
            } catch (err) {
                alert('Network error. Render server might be waking up, please try again.');
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Load posts on page launch
        fetchPosts();
    </script>
</body>
            </html>

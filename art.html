<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta name="copyright" content="SWYPYY. All rights reserved.">
    <meta name="robots" content="index, follow">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Art Gallery | SWYPYY</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc',
                            accent: '#d8b4fe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        cursive: ['Caveat', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&display=swap');

        body {
            background-color: #07060b;
            color: #f3f4f6;
        }

        .s-logo-handwritten {
            font-family: 'Caveat', cursive;
            line-height: 1;
        }

        .purple-glow-card {
            box-shadow: 0 0 35px -5px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-purple selection:text-white">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-void/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- BRAND LOGO HEADER (LEFT ALIGNED) -->
            <a href="index.html" class="flex items-center group">
                <img src="Assets/logo.png" alt="Swypyy Logo" class="h-9 sm:h-11 w-auto object-contain transition-transform group-hover:scale-105" onerror="this.onerror=null; this.src='assets/logo.png'; this.onerror=function(){this.style.display='none'; document.getElementById('textBrandLogo').style.display='flex';};">
                <div id="textBrandLogo" class="hidden items-center gap-1">
                    <span class="s-logo-handwritten text-4xl font-bold text-brand-purple">S</span>
                    <span class="text-2xl font-bold tracking-wider text-white">wypyy</span>
                </div>
            </a>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow pb-16 px-6">
        
        <!-- BACK BUTTON (TUCKED DIRECTLY UNDER HEADER WITH NO SPACE) -->
        <div class="max-w-6xl mx-auto px-6 pt-4">
            <a href="index.html" class="text-gray-400 hover:text-brand-glow transition-colors inline-flex items-center" aria-label="Back to Home">
                <i data-lucide="arrow-left" class="w-7 h-7"></i>
            </a>
        </div>

        <div class="max-w-6xl mx-auto space-y-8 pt-4">
            
            <div class="text-center space-y-3">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-white">My Art Gallery</h1>
                <p class="text-gray-400">Drawings and digital art pieces created by Swypyy</p>
            </div>

            <!-- ART GALLERY GRID -->
            <div class="max-w-xs mx-auto sm:max-w-none grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-8 pt-4">
                
                <!-- ART CARD EXAMPLE (Repeat this block for each new piece of art) -->
                <div class="group cursor-pointer flex flex-col gap-3" onclick="openArtModal('Assets/Art/artwork-1.jpg', 'First Artwork Title')">
                    <!-- Image Container -->
                    <div class="w-full aspect-[4/3] bg-surface-light rounded-2xl border border-white/10 overflow-hidden relative shadow-xl group-hover:border-brand-purple/60 group-hover:shadow-brand-purple/20 transition-all duration-300">
                        <img src="Assets/Art/artwork-1.jpg" alt="Artwork 1" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='assets/Art/artwork-1.jpg';">
                        <!-- Dark overlay on hover -->
                        <div class="absolute inset-0 bg-brand-purple/0 group-hover:bg-brand-purple/10 transition-colors duration-300"></div>
                    </div>
                    <!-- Title -->
                    <div class="text-left px-1">
                        <h2 class="text-base sm:text-lg font-bold text-white group-hover:text-brand-glow transition-colors">First Artwork Title</h2>
                    </div>
                </div>

                <!-- You can add more art cards here following the exact same structure! -->

            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-8 border-t border-white/5 bg-void text-center text-gray-500 text-xs">
        <div class="max-w-6xl mx-auto px-6">
            <p>&copy; 2026 SWYPYY. All rights reserved.</p>
        </div>
    </footer>

    <!-- ART LIGHTBOX / PREVIEW MODAL -->
    <div id="artModal" class="fixed inset-0 bg-void/90 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="relative max-w-4xl w-full bg-surface border border-brand-purple/40 rounded-3xl p-4 sm:p-6 text-center space-y-4 purple-glow-card">
            
            <!-- CLOSE BUTTON (X) -->
            <button onclick="closeArtModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 bg-surface-light rounded-full border border-white/10 focus:outline-none z-10">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <!-- FULL IMAGE PREVIEW -->
            <div class="overflow-hidden rounded-2xl max-h-[70vh] flex items-center justify-center bg-void">
                <img id="modalArtImage" src="" alt="Art Preview" class="max-h-[70vh] w-auto object-contain">
            </div>

            <!-- TITLE -->
            <h3 id="modalArtTitle" class="text-xl font-bold text-white">Artwork Title</h3>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // Modal Logic to view art larger
        function openArtModal(imageSrc, artTitle) {
            document.getElementById('modalArtImage').src = imageSrc;
            document.getElementById('modalArtTitle').innerText = artTitle;
            
            const modal = document.getElementById('artModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeArtModal() {
            const modal = document.getElementById('artModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
                </html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWYPYY | Art Gallery</title>
    
    <!-- Proprietary Copyright Ownership Protection Meta Tags -->
    <meta name="copyright" content="SWYPYY. All rights reserved.">
    <meta name="robots" content="index, follow">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc',
                            accent: '#d8b4fe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        cursive: ['Caveat', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&display=swap');

        body {
            background-color: #07060b;
            color: #f3f4f6;
        }

        .purple-glow-bg {
            background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.25) 0%, rgba(7, 6, 11, 0) 70%);
        }

        .s-logo-handwritten {
            font-family: 'Caveat', cursive;
            line-height: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-purple selection:text-white">

    <!-- HEADER NAVIGATION -->
    <header class="sticky top-0 z-40 bg-void/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- BRAND LOGO HEADER -->
            <a href="index.html" class="flex items-center group">
                <img src="Assets/logo.png" alt="Swypyy Logo" class="h-9 sm:h-11 w-auto object-contain transition-transform group-hover:scale-105" onerror="this.onerror=null; this.src='assets/logo.png'; this.onerror=function(){this.style.display='none'; document.getElementById('textBrandLogo').style.display='flex';};">
                <div id="textBrandLogo" class="hidden items-center gap-1">
                    <span class="s-logo-handwritten text-4xl font-bold text-brand-purple">S</span>
                    <span class="text-2xl font-bold tracking-wider text-white">wypyy</span>
                </div>
            </a>

            <!-- DESKTOP MENU -->
            <nav class="hidden md:flex items-center gap-8">
                <a href="index.html#home" class="text-sm font-semibold text-gray-300 hover:text-brand-glow transition-colors">Home</a>
                <a href="index.html#creations-showcase" class="text-sm font-semibold text-gray-300 hover:text-brand-glow transition-colors">My Creations</a>
                <a href="novels.html" class="text-sm font-semibold text-gray-300 hover:text-brand-glow transition-colors">My Webnovels</a>
                <a href="art.html" class="text-sm font-semibold text-brand-glow transition-colors">My Arts</a>
                <a href="index.html#about" class="text-sm font-semibold text-gray-300 hover:text-brand-glow transition-colors">About Me</a>
                <a href="index.html#contact" class="text-sm font-semibold text-gray-300 hover:text-brand-glow transition-colors">Contact</a>
            </nav>

            <!-- MOBILE HAMBURGER BUTTON -->
            <button id="menuBtn" class="md:hidden p-2 text-gray-300 hover:text-brand-glow focus:outline-none" aria-label="Toggle Menu">
                <i data-lucide="menu" class="w-7 h-7"></i>
            </button>
        </div>
    </header>

    <!-- FULLSCREEN MOBILE MENU OVERLAY -->
    <div id="mobileMenu" class="fixed inset-0 bg-void/98 backdrop-blur-xl z-50 flex flex-col justify-center items-center gap-6 md:hidden hidden transition-all duration-300">
        <button id="closeMenuBtn" class="absolute top-6 right-6 p-2 text-gray-400 hover:text-brand-glow">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        
        <a href="index.html#home" class="mobile-nav-link text-xl font-bold text-white hover:text-brand-glow">Home</a>
        <a href="index.html#creations-showcase" class="mobile-nav-link text-xl font-bold text-white hover:text-brand-glow">My Creations</a>
        <a href="novels.html" class="mobile-nav-link text-xl font-bold text-white hover:text-brand-glow">My Webnovels</a>
        <a href="art.html" class="mobile-nav-link text-xl font-bold text-brand-glow">My Arts</a>
        <a href="index.html#about" class="mobile-nav-link text-xl font-bold text-white hover:text-brand-glow">About Me</a>
        <a href="index.html#contact" class="mobile-nav-link text-xl font-bold text-white hover:text-brand-glow">Contact</a>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-grow">
        
        <!-- HEADER SECTION -->
        <section class="py-16 md:py-24 px-6 purple-glow-bg text-center space-y-4">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-light border border-brand-purple/30 text-brand-light text-xs font-semibold uppercase tracking-wider">
                <i data-lucide="palette" class="w-3.5 h-3.5"><span>Gallery</span></i>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">My Art Gallery</h1>
            <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">Visual art experiments and drawings created as I learn.</p>
        </section>

        <!-- EMPTY GALLERY SECTION -->
        <section class="py-24 px-6">
            <div class="max-w-md mx-auto text-center bg-surface border border-white/10 rounded-3xl p-12 space-y-4 shadow-xl">
                <div class="w-16 h-16 rounded-2xl bg-brand-purple/20 border border-brand-purple/40 flex items-center justify-center mx-auto text-brand-glow">
                    <i data-lucide="image-off" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-white">There is nothing here</h3>
                <p class="text-sm text-gray-400">Check back later once I upload my latest art pieces to the gallery!</p>
            </div>
        </section>

    </main>

    <!-- FOOTER WITH HARDCODED JS COPYRIGHT PROTECTION -->
    <footer id="footer-container" class="py-8 border-t border-white/5 bg-void text-center text-gray-500 text-xs">
        <!-- Injected via JavaScript below -->
    </footer>

    <!-- JAVASCRIPT FOR MOBILE MENU & HARDCODED COPYRIGHT -->
    <script>
        lucide.createIcons();

        // Mobile menu toggle logic
        const menuBtn = document.getElementById('menuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileLinks = document.querySelectorAll('.mobile-nav-link');

        menuBtn.addEventListener('click', () => mobileMenu.classList.remove('hidden'));
        closeMenuBtn.addEventListener('click', () => mobileMenu.classList.add('hidden'));
        mobileLinks.forEach(link => link.addEventListener('click', () => mobileMenu.classList.add('hidden')));

        // Hardcoded Copyright Injection
        const currentYear = new Date().getFullYear();
        document.getElementById('footer-container').innerHTML = `
            <div class="max-w-6xl mx-auto px-6">
                <p>&copy; ${currentYear} SWYPYY. All rights reserved. Unauthorized duplication prohibited.</p>
            </div>
        `;
    </script>
</body>
    </html>

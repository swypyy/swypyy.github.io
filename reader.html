<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07060b">

    <!-- SEO -->
    <title>Novel Reader | SWYPYY</title>
    <meta name="description" content="Read original web novels by Swypyy. Explore stories and chapters in the SWYPYY reading library.">
    <meta name="keywords" content="Swypyy, web novels, online stories, novel reader, original stories">
    <meta name="author" content="Swypyy">
    <meta name="robots" content="noindex, follow">
    <meta name="copyright" content="SWYPYY. All rights reserved.">

    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://swypyy.github.io/reader.html">
    <meta property="og:title" content="Novel Reader | SWYPYY">
    <meta property="og:description" content="Read original web novels by Swypyy.">
    <meta property="og:image" content="https://swypyy.github.io/assets/logo.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Novel Reader | SWYPYY">
    <meta name="twitter:description" content="Read original web novels by Swypyy.">
    <meta name="twitter:image" content="https://swypyy.github.io/assets/logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/s-logo.png">
    <link rel="apple-touch-icon" href="assets/s-logo.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc',
                            accent: '#d8b4fe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        cursive: ['Caveat', 'cursive', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap');

        body {
            background-color: #07060b;
            color: #f3f4f6;
        }

        .s-logo-handwritten {
            font-family: 'Caveat', cursive;
            line-height: 1;
        }

        .chapter-text {
            overflow-wrap: anywhere;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 20px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-brand-purple selection:text-white">

    <!-- CHAPTER SELECTOR MODAL -->
    <div
        id="settingsModal"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4"
    >
        <div
            id="modalContainer"
            class="bg-surface border border-white/10 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-300"
        >

            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-4 border-b border-white/10">

                <div class="flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-brand-glow"></i>

                    <h3 class="text-lg font-bold text-white">
                        Select Chapter
                    </h3>
                </div>

                <button
                    onclick="closeSettingsMenu()"
                    class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/5 transition-colors"
                    aria-label="Close Menu"
                >
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>

            </div>

            <!-- Chapter Search -->
            <div class="py-4">
                <div class="relative">

                    <i
                        data-lucide="search"
                        class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                    ></i>

                    <input
                        type="number"
                        id="chapterSearchInput"
                        placeholder="Search chapter number..."
                        oninput="filterChapters()"
                        class="w-full bg-void border border-white/10 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-purple transition-colors"
                    >

                </div>
            </div>

            <!-- Chapter List -->
            <div
                id="chapterListContainer"
                class="overflow-y-auto space-y-2 pr-1 flex-grow custom-scrollbar max-h-60"
            >
                <p class="text-sm text-gray-500 text-center py-4">
                    Loading chapters...
                </p>
            </div>

            <!-- Modal Footer -->
            <div class="pt-4 border-t border-white/10 text-center text-xs text-gray-500">
                Select any available chapter to jump instantly.
            </div>

        </div>
    </div>


    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-void/90 backdrop-blur-md border-b border-white/5">

        <div class="w-full px-6 md:px-10 xl:px-16 h-20 flex items-center justify-between">

            <!-- Logo -->
            <a href="index.html" class="flex items-center group">

                <img
                    src="assets/logo.png"
                    alt="Swypyy Logo"
                    class="h-9 sm:h-11 w-auto object-contain transition-transform group-hover:scale-105"
                    onerror="this.onerror=null; this.style.display='none'; document.getElementById('textBrandLogo').style.display='flex';"
                >

                <div id="textBrandLogo" class="hidden items-center gap-1">

                    <span class="s-logo-handwritten text-4xl font-bold text-brand-purple">
                        S
                    </span>

                    <span class="text-2xl font-bold tracking-wider text-white">
                        wypyy
                    </span>

                </div>

            </a>

            <!-- Settings Button -->
            <button
                onclick="openSettingsMenu()"
                class="w-10 h-10 rounded-xl bg-surface border border-white/10 flex items-center justify-center text-brand-glow hover:border-brand-purple hover:scale-105 transition-all shadow-md"
                aria-label="Open Chapter Settings"
            >
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>

        </div>

    </header>


    <!-- BACK BUTTON -->
    <div class="w-full max-w-4xl mx-auto px-6 pt-4">

        <a
            href="novels.html"
            class="text-gray-400 hover:text-brand-glow transition-colors inline-flex items-center"
            aria-label="Back to Novels"
        >
            <i data-lucide="arrow-left" class="w-7 h-7"></i>
        </a>

    </div>


    <!-- MAIN READER -->
    <main class="flex-grow py-8 px-6">

        <div class="max-w-3xl mx-auto space-y-8">

            <!-- Chapter Content -->
            <article
                id="chapterContent"
                class="chapter-text prose prose-invert max-w-none text-gray-300 font-serif text-lg leading-relaxed space-y-6"
            >
                <p class="animate-pulse text-gray-500">
                    Loading novel...
                </p>
            </article>


            <!-- CHAPTER NAVIGATION -->
            <div
                id="readerFooter"
                class="pt-8 border-t border-white/10 space-y-4"
            >

                <!-- Chapter Indicator -->
                <div class="text-center">

                    <span
                        id="chapterIndicator"
                        class="text-xs font-semibold tracking-wider text-gray-400 uppercase bg-surface px-3 py-1 rounded-full border border-white/10"
                    >
                        Ch. 1
                    </span>

                </div>


                <!-- Navigation Buttons -->
                <div class="flex items-center justify-between gap-3">

                    <button
                        onclick="changeChapter(-1)"
                        id="prevBtn"
                        disabled
                        class="px-5 py-2.5 rounded-xl bg-surface border border-white/10 text-gray-300 hover:text-white hover:border-brand-purple/40 font-semibold text-sm transition-all disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                        Previous Chapter
                    </button>

                    <button
                        onclick="changeChapter(1)"
                        id="nextBtn"
                        disabled
                        class="px-5 py-2.5 rounded-xl bg-brand-purple hover:bg-brand-glow text-white font-bold text-sm transition-all disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                        Next Chapter
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="py-8 border-t border-white/5 bg-void text-center text-gray-500 text-xs">

        <div class="max-w-4xl mx-auto px-6">

            <p>
                &copy; <span id="currentYear"></span> SWYPYY.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- READER JAVASCRIPT -->
    <script>

        // ----------------------------------------
        // INITIALIZATION
        // ----------------------------------------

        if (
            typeof lucide !== 'undefined' &&
            typeof lucide.createIcons === 'function'
        ) {
            lucide.createIcons();
        }

        document.getElementById('currentYear').textContent =
            new Date().getFullYear();


        // ----------------------------------------
        // NOVEL CONFIGURATION
        // ----------------------------------------

        const urlParams = new URLSearchParams(window.location.search);

        const novelFolder = urlParams.get('novel');

        const chapterContent = document.getElementById('chapterContent');

        const readerFooter = document.getElementById('readerFooter');

        let currentChapter = 1;

        let availableChapters = [];

        let currentChapterIndex = 0;


        // Validate the novel folder name.
        function isValidNovelFolder(folder) {

            return (
                typeof folder === 'string' &&
                /^[a-zA-Z0-9_-]+$/.test(folder)
            );

        }


        // ----------------------------------------
        // ICON INITIALIZATION
        // ----------------------------------------

        function refreshIcons() {

            if (
                typeof lucide !== 'undefined' &&
                typeof lucide.createIcons === 'function'
            ) {
                lucide.createIcons();
            }

        }


        // ----------------------------------------
        // SETTINGS MODAL
        // ----------------------------------------

        function openSettingsMenu() {

            if (!novelFolder || availableChapters.length === 0) {
                return;
            }

            const modal = document.getElementById('settingsModal');

            const container = document.getElementById('modalContainer');

            modal.classList.remove(
                'opacity-0',
                'pointer-events-none'
            );

            container.classList.remove('scale-95');

            container.classList.add('scale-100');

            document.getElementById('chapterSearchInput').value = '';

            buildChapterList();

        }


        function closeSettingsMenu() {

            const modal = document.getElementById('settingsModal');

            const container = document.getElementById('modalContainer');

            modal.classList.add(
                'opacity-0',
                'pointer-events-none'
            );

            container.classList.remove('scale-100');

            container.classList.add('scale-95');

        }


        // Close modal when clicking outside.
        document.getElementById('settingsModal').addEventListener(
            'click',
            function(event) {

                if (event.target === this) {
                    closeSettingsMenu();
                }

            }
        );


        // Close modal using Escape.
        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {
                closeSettingsMenu();
            }

        });


        // ----------------------------------------
        // CHAPTER LIST
        // ----------------------------------------

        function buildChapterList(filterVal = '') {

            const listContainer =
                document.getElementById('chapterListContainer');

            listContainer.innerHTML = '';

            const filteredChapters = availableChapters.filter(number => {

                return number.toString().includes(filterVal);

            });


            if (filteredChapters.length === 0) {

                const emptyMessage = document.createElement('p');

                emptyMessage.className =
                    'text-sm text-gray-500 text-center py-4';

                emptyMessage.textContent = 'No matching chapters found.';

                listContainer.appendChild(emptyMessage);

                return;

            }


            filteredChapters.forEach(number => {

                const isCurrent = number === currentChapter;

                const item = document.createElement('button');

                item.type = 'button';

                item.className = `
                    w-full text-left px-4 py-3 rounded-xl
                    flex items-center justify-between transition-all
                    ${
                        isCurrent
                            ? 'bg-brand-purple text-white font-bold shadow-lg shadow-brand-purple/20'
                            : 'bg-void/40 hover:bg-white/5 text-gray-300 border border-white/5'
                    }
                `;

                const title = document.createElement('span');

                title.textContent = `Chapter ${number}`;

                item.appendChild(title);


                if (isCurrent) {

                    const badge = document.createElement('span');

                    badge.className =
                        'text-xs bg-white/20 px-2 py-0.5 rounded-full';

                    badge.textContent = 'Current';

                    item.appendChild(badge);

                } else {

                    const icon = document.createElement('i');

                    icon.setAttribute('data-lucide', 'chevron-right');

                    icon.className = 'w-4 h-4 text-gray-500';

                    item.appendChild(icon);

                }


                item.addEventListener('click', function() {

                    loadChapter(number);

                    closeSettingsMenu();

                });


                listContainer.appendChild(item);

            });

            refreshIcons();

        }


        function filterChapters() {

            const query = document
                .getElementById('chapterSearchInput')
                .value
                .trim();

            buildChapterList(query);

        }


        // ----------------------------------------
        // DETECT AVAILABLE CHAPTERS
        // ----------------------------------------

        async function scanAvailableChapters() {

            const basePath = `assets/novels/${novelFolder}/`;

            const chapters = [];

            const maximumChapters = 100;

            const batchSize = 10;


            // Check chapters in small batches.
            // This allows chapter numbering gaps.

            for (
                let start = 1;
                start <= maximumChapters;
                start += batchSize
            ) {

                const batch = [];

                const end = Math.min(
                    start + batchSize - 1,
                    maximumChapters
                );


                for (let number = start; number <= end; number++) {

                    batch.push(number);

                }


                const results = await Promise.all(

                    batch.map(async number => {

                        try {

                            const response = await fetch(
                                `${basePath}ch${number}.txt`,
                                {
                                    method: 'HEAD',
                                    cache: 'no-cache'
                                }
                            );

                            return response.ok ? number : null;

                        } catch (error) {

                            console.error(
                                `Could not check chapter ${number}:`,
                                error
                            );

                            return null;

                        }

                    })

                );


                results.forEach(number => {

                    if (number !== null) {
                        chapters.push(number);
                    }

                });

            }


            availableChapters = chapters;

            return availableChapters;

        }


        // ----------------------------------------
        // UPDATE NAVIGATION
        // ----------------------------------------

        function updateNavigation() {

            currentChapterIndex =
                availableChapters.indexOf(currentChapter);

            const previousButton =
                document.getElementById('prevBtn');

            const nextButton =
                document.getElementById('nextBtn');


            previousButton.disabled =
                currentChapterIndex <= 0;


            nextButton.disabled =
                currentChapterIndex === -1 ||
                currentChapterIndex >= availableChapters.length - 1;


            document.getElementById('chapterIndicator').textContent =
                `Ch. ${currentChapter}`;

        }


        // ----------------------------------------
        // LOAD NOVEL
        // ----------------------------------------

        async function loadNovel() {

            if (!novelFolder) {

                chapterContent.innerHTML = `
                    <div class="text-center py-12 space-y-4">

                        <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto">
                            <i data-lucide="alert-circle" class="w-8 h-8"></i>
                        </div>

                        <h2 class="text-2xl font-bold text-white">
                            No Novel Specified
                        </h2>

                        <p class="text-gray-400 text-sm max-w-md mx-auto">
                            Please select a story from the novels page.
                        </p>

                        <div class="pt-2">

                            <a
                                href="novels.html"
                                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-purple hover:bg-brand-glow text-white font-bold text-sm transition-all"
                            >
                                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                                Return to Novels
                            </a>

                        </div>

                    </div>
                `;

                readerFooter.style.display = 'none';

                refreshIcons();

                return;

            }


            if (!isValidNovelFolder(novelFolder)) {

                showError(
                    'Invalid Novel',
                    'The requested novel address is invalid.'
                );

                return;

            }


            try {

                chapterContent.innerHTML = `
                    <p class="animate-pulse text-gray-500 text-center py-10">
                        Finding available chapters...
                    </p>
                `;


                await scanAvailableChapters();


                if (availableChapters.length === 0) {

                    showError(
                        'No Chapters Found',
                        'No chapter files could be found. Please check the novel folder and chapter filenames.'
                    );

                    return;

                }


                // Start with chapter 1 if available.
                // Otherwise use the first available chapter.

                currentChapter = availableChapters.includes(1)
                    ? 1
                    : availableChapters[0];


                await loadChapter(currentChapter);

            } catch (error) {

                console.error('Error loading novel:', error);

                showError(
                    'Unable to Load Novel',
                    'Something went wrong while loading this novel. Please try again later.'
                );

            }

        }


        // ----------------------------------------
        // ERROR DISPLAY
        // ----------------------------------------

        function showError(title, message) {

            chapterContent.innerHTML = '';

            const wrapper = document.createElement('div');

            wrapper.className =
                'text-center py-12 space-y-4';


            const iconWrapper = document.createElement('div');

            iconWrapper.className =
                'w-16 h-16 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto';

            const icon = document.createElement('i');

            icon.setAttribute('data-lucide', 'alert-circle');

            icon.className = 'w-8 h-8';

            iconWrapper.appendChild(icon);


            const heading = document.createElement('h2');

            heading.className =
                'text-2xl font-bold text-white';

            heading.textContent = title;


            const paragraph = document.createElement('p');

            paragraph.className =
                'text-gray-400 text-sm max-w-md mx-auto';

            paragraph.textContent = message;


            const link = document.createElement('a');

            link.href = 'novels.html';

            link.className =
                'inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-purple hover:bg-brand-glow text-white font-bold text-sm transition-all mt-3';

            link.textContent = 'Return to Novels';


            wrapper.appendChild(iconWrapper);

            wrapper.appendChild(heading);

            wrapper.appendChild(paragraph);

            wrapper.appendChild(link);


            chapterContent.appendChild(wrapper);

            readerFooter.style.display = 'none';

            refreshIcons();

        }


        // ----------------------------------------
        // SAFE CHAPTER TEXT FORMATTING
        // ----------------------------------------

        function formatText(rawText) {

            const lines = rawText.replace(/\r/g, '').split('\n');

            const headingText = lines[0]?.trim() || 'Untitled Chapter';

            // Preserve the original file format:
            // First line = chapter title.
            // Second line = optional separator or blank line.
            // Remaining lines = chapter content.

            const bodyText = lines.slice(2).join('\n').trim();

            const fragment = document.createDocumentFragment();


            const heading = document.createElement('h2');

            heading.className =
                'text-2xl sm:text-3xl font-extrabold text-white mb-6';

            heading.textContent = headingText;

            fragment.appendChild(heading);


            const paragraphs = bodyText.split(/\n\s*\n/);


            paragraphs.forEach(text => {

                const cleanedText = text.trim();

                if (!cleanedText) {
                    return;
                }


                const paragraph = document.createElement('p');

                paragraph.className = 'whitespace-pre-line';

                // textContent prevents chapter text from being treated as HTML.
                paragraph.textContent = cleanedText;

                fragment.appendChild(paragraph);

            });


            return fragment;

        }


        // ----------------------------------------
        // LOAD CHAPTER
        // ----------------------------------------

        async function loadChapter(chapterNum) {

            if (!availableChapters.includes(chapterNum)) {
                return;
            }


            const basePath = `assets/novels/${novelFolder}/`;

            const chapterFile = `${basePath}ch${chapterNum}.txt`;


            chapterContent.innerHTML = `
                <p class="animate-pulse text-gray-500 text-center py-10">
                    Loading chapter ${chapterNum}...
                </p>
            `;


            try {

                const response = await fetch(chapterFile, {
                    cache: 'no-cache'
                });


                if (!response.ok) {

                    throw new Error(
                        `Chapter request failed: ${response.status}`
                    );

                }


                const rawText = await response.text();


                chapterContent.replaceChildren(
                    formatText(rawText)
                );


                currentChapter = chapterNum;

                updateNavigation();

                readerFooter.style.display = 'block';


                // Refresh chapter list if the modal is open.
                const modal = document.getElementById('settingsModal');

                if (!modal.classList.contains('pointer-events-none')) {

                    const query = document
                        .getElementById('chapterSearchInput')
                        .value
                        .trim();

                    buildChapterList(query);

                }


                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });


            } catch (error) {

                console.error('Error loading chapter:', error);

                chapterContent.innerHTML = `
                    <div class="text-center py-12 space-y-3">

                        <h2 class="text-xl font-bold text-white">
                            Chapter Unavailable
                        </h2>

                        <p class="text-gray-400 text-sm">
                            This chapter could not be loaded. Please try again.
                        </p>

                    </div>
                `;

            }

        }


        // ----------------------------------------
        // PREVIOUS / NEXT CHAPTER
        // ----------------------------------------

        function changeChapter(direction) {

            const nextIndex = currentChapterIndex + direction;


            if (
                nextIndex < 0 ||
                nextIndex >= availableChapters.length
            ) {
                return;
            }


            const nextChapter = availableChapters[nextIndex];

            loadChapter(nextChapter);

        }


        // ----------------------------------------
        // START READER
        // ----------------------------------------

        loadNovel();

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader | SWYPYY</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc',
                            accent: '#d8b4fe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        cursive: ['Caveat', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap');

        body {
            background-color: #07060b;
            color: #f3f4f6;
        }

        .s-logo-handwritten {
            font-family: 'Caveat', cursive;
            line-height: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-purple selection:text-white relative">

    <!-- CHAPTER SELECTOR MODAL / MENU -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="bg-surface border border-white/10 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-300" id="modalContainer">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-4 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-brand-glow"></i>
                    <h3 class="text-lg font-bold text-white">Select Chapter</h3>
                </div>
                <button onclick="closeSettingsMenu()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/5 transition-colors" aria-label="Close Menu">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Search Input -->
            <div class="py-4">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="number" id="chapterSearchInput" placeholder="Search chapter number (e.g. 1, 2, 5)..." oninput="filterChapters()" class="w-full bg-void border border-white/10 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-purple transition-colors">
                </div>
            </div>

            <!-- Endless Scroll Chapter List -->
            <div id="chapterListContainer" class="overflow-y-auto space-y-2 pr-1 flex-grow custom-scrollbar max-h-60">
                <!-- Dynamically populated via script -->
            </div>

            <!-- Modal Footer -->
            <div class="pt-4 border-t border-white/10 text-center text-xs text-gray-500">
                Tap any chapter to jump instantly
            </div>
        </div>
    </div>

    <!-- TOP HEADER WITH LOGO ON LEFT & SETTINGS ON RIGHT -->
    <header class="sticky top-0 z-40 bg-void/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <!-- Logo (Left) -->
            <a href="index.html" class="flex items-center group">
                <img src="assets/logo.png" alt="Swypyy Logo" class="h-9 sm:h-11 w-auto object-contain transition-transform group-hover:scale-105" onerror="this.onerror=null; this.src='Assets/logo.png';">
            </a>
            <!-- Settings Button (Right) -->
            <button onclick="openSettingsMenu()" class="w-10 h-10 rounded-xl bg-surface border border-white/10 flex items-center justify-center text-brand-glow hover:border-brand-purple hover:scale-105 transition-all shadow-md" aria-label="Open Chapter Settings">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- BACK BUTTON DIRECTLY UNDER HEADER WITH NO GAP -->
    <div class="max-w-4xl mx-auto w-full px-6 pt-4">
        <a href="novels.html" class="text-gray-400 hover:text-brand-glow transition-colors inline-flex items-center" aria-label="Back to Novels">
            <i data-lucide="arrow-left" class="w-7 h-7"></i>
        </a>
    </div>

    <!-- MAIN READER CONTENT -->
    <main class="flex-grow py-8 px-6">
        <div class="max-w-3xl mx-auto space-y-8">
            
            <!-- Novel Metadata Header -->
            <div id="novelHeader" class="border-b border-white/10 pb-6 space-y-2">
                <span id="novelGenre" class="text-xs font-bold tracking-wider text-brand-glow uppercase">Loading Genre...</span>
                <h1 id="novelTitle" class="text-3xl sm:text-4xl font-extrabold text-white">Loading Novel...</h1>
            </div>

            <!-- Chapter Text Container -->
            <article id="chapterContent" class="prose prose-invert max-w-none text-gray-300 font-serif text-lg leading-relaxed space-y-6">
                <p class="animate-pulse text-gray-500">Loading chapter from file...</p>
            </article>

            <!-- Chapter Bottom Navigation Footer -->
            <div class="pt-8 border-t border-white/10 space-y-4">
                <!-- Clean un-squeezed chapter indicator row -->
                <div class="text-center">
                    <span id="chapterIndicator" class="text-xs font-semibold tracking-wider text-gray-400 uppercase bg-surface px-3 py-1 rounded-full border border-white/10">Ch. 1</span>
                </div>
                <!-- Buttons Row -->
                <div class="flex items-center justify-between">
                    <button onclick="changeChapter(-1)" id="prevBtn" class="px-5 py-2.5 rounded-xl bg-surface border border-white/10 text-gray-300 hover:text-white hover:border-brand-purple/40 font-semibold text-sm transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                        Previous Chapter
                    </button>
                    <button onclick="changeChapter(1)" id="nextBtn" class="px-5 py-2.5 rounded-xl bg-brand-purple hover:bg-brand-glow text-white font-bold text-sm transition-all">
                        Next Chapter
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-8 border-t border-white/5 bg-void text-center text-gray-500 text-xs">
        <div class="max-w-4xl mx-auto px-6">
            <p>&copy; 2026 SWYPYY. All rights reserved.</p>
        </div>
    </footer>

    <!-- READER LOGIC SCRIPT -->
    <script>
        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const novelFolder = urlParams.get('novel') || 'just-a-dream';
        
        let currentChapter = 1;
        let maxAvailableChapter = 1; // Dynamically detected based on uploaded files

        // --- SETTINGS MODAL FUNCTIONS ---
        function openSettingsMenu() {
            const modal = document.getElementById('settingsModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
            buildChapterList();
        }

        function closeSettingsMenu() {
            const modal = document.getElementById('settingsModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
        }

        function buildChapterList(filterVal = '') {
            const listContainer = document.getElementById('chapterListContainer');
            listContainer.innerHTML = '';

            for (let i = 1; i <= maxAvailableChapter; i++) {
                if (filterVal && !i.toString().includes(filterVal)) continue;

                const isCurrent = (i === currentChapter);
                
                const item = document.createElement('button');
                item.className = `w-full text-left px-4 py-3 rounded-xl flex items-center justify-between transition-all ${
                    isCurrent ? 'bg-brand-purple text-white font-bold shadow-lg shadow-brand-purple/20' : 'bg-void/40 hover:bg-white/5 text-gray-300 border border-white/5'
                }`;
                item.innerHTML = `
                    <span>Chapter ${i}</span>
                    ${isCurrent ? '<span class="text-xs bg-white/20 px-2 py-0.5 rounded-full">Current</span>' : '<i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>'}
                `;
                item.onclick = () => {
                    currentChapter = i;
                    loadChapter(currentChapter);
                    closeSettingsMenu();
                };
                listContainer.appendChild(item);
            }
            lucide.createIcons();
        }

        function filterChapters() {
            const query = document.getElementById('chapterSearchInput').value.trim();
            buildChapterList(query);
        }

        // --- AUTOMATICALLY DETECT LATEST UPLOADED CHAPTER ---
        async function scanAvailableChapters() {
            const basePath = `assets/novels/${novelFolder}/`;
            let foundMax = 1;
            
            for (let i = 1; i <= 100; i++) {
                try {
                    const res = await fetch(`${basePath}ch${i}.txt`, { method: 'HEAD' });
                    if (res.ok) {
                        foundMax = i;
                    } else {
                        break;
                    }
                } catch (e) {
                    break;
                }
            }
            maxAvailableChapter = foundMax;
        }

        // --- NOVEL & CHAPTER LOADING ---
        async function loadNovel() {
            const basePath = `assets/novels/${novelFolder}/`;

            try {
                const infoRes = await fetch(basePath + 'info.txt');
                if (infoRes.ok) {
                    const infoText = await infoRes.text();
                    parseInfo(infoText);
                } else {
                    document.getElementById('novelTitle').innerText = "Novel Not Found";
                    document.getElementById('chapterContent').innerHTML = "<p>Could not locate info.txt inside assets/novels/" + novelFolder + "/</p>";
                    return;
                }

                await scanAvailableChapters();
                loadChapter(currentChapter);

            } catch (err) {
                console.error("Error loading novel:", err);
                document.getElementById('novelTitle').innerText = "Error Loading Content";
                document.getElementById('chapterContent').innerHTML = "<p>Please ensure your folder and text files are correctly pushed to GitHub.</p>";
            }
        }

        function parseInfo(text) {
            const lines = text.split('\n');
            let title = "Web Novel";
            let genre = "Fiction";

            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const val = parts.slice(1).join(':').trim();
                    if (key === 'title') title = val;
                    if (key === 'genre') genre = val;
                }
            });

            document.getElementById('novelTitle').innerText = title;
            document.getElementById('novelGenre').innerText = genre;
        }

        async function loadChapter(chapterNum) {
            const basePath = `assets/novels/${novelFolder}/`;
            const chapterFile = `${basePath}ch${chapterNum}.txt`;

            try {
                const res = await fetch(chapterFile);
                if (res.ok) {
                    const rawText = await res.text();
                    document.getElementById('chapterContent').innerHTML = formatText(rawText);
                    document.getElementById('chapterIndicator').innerText = `Ch. ${chapterNum}`;
                    
                    document.getElementById('prevBtn').disabled = (chapterNum <= 1);
                    document.getElementById('nextBtn').disabled = (chapterNum >= maxAvailableChapter);
                    
                    // Automatically scroll to the top of the page when loading a chapter
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    document.getElementById('chapterContent').innerHTML = `<p class='text-gray-400 italic'>Chapter ${chapterNum} is not available yet.</p>`;
                }
            } catch (err) {
                console.error("Error loading chapter:", err);
            }
        }

        function formatText(rawText) {
            const lines = rawText.split('\n');
            
            if (lines.length > 0) {
                const chapterHeading = lines[0].trim();
                const bodyParagraphs = lines.slice(2);

                let html = `<h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-6">${chapterHeading}</h2>`;
                
                html += bodyParagraphs
                    .join('\n')
                    .split('\n\n')
                    .map(para => para.trim() ? `<p>${para.trim().replace(/\n/g, '<br>')}</p>` : '')
                    .join('');

                return html;
            }

            return `<p>${rawText}</p>`;
        }

        function changeChapter(dir) {
            currentChapter += dir;
            if (currentChapter < 1) currentChapter = 1;
            if (currentChapter > maxAvailableChapter) currentChapter = maxAvailableChapter;
            loadChapter(currentChapter);
        }

        // Initialize reader
        loadNovel();
    </script>
</body>
    </html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - SWYPYY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#07060b',
                        cardBg: '#0f0e17',
                        accentPurple: '#7c3aed',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #07060b;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-purple-600 selection:text-white">

    <!-- Top Navigation Header with Logo -->
    <header class="w-full border-b border-white/10 bg-darkBg/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center group">
                <img src="Assets/logo.png" alt="Swypyy Logo" class="h-8 w-auto object-contain transition-transform group-hover:scale-105" onerror="this.onerror=null; this.src='assets/logo.png';">
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="novels.html" class="text-white font-semibold">My Novels</a>
                <a href="projects.html" class="hover:text-white transition-colors">Projects</a>
                <a href="index.html#about" class="hover:text-white transition-colors">About Me</a>
                <a href="index.html#contact" class="hover:text-white transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Back Button directly under header with zero whitespace -->
    <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4">
        <a href="novels.html" class="inline-flex items-center text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
    </div>

    <!-- Main Reader Content Area -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        
        <!-- Novel & Chapter Header Info -->
        <div id="novelHeader" class="mb-8 border-b border-white/10 pb-6">
            <span id="novelGenre" class="text-xs font-bold tracking-wider text-purple-400 uppercase">Loading Genre...</span>
            <h1 id="novelTitle" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mt-1">Loading Novel...</h1>
            <p id="chapterTitle" class="text-base text-slate-400 mt-2 font-medium">Chapter 1</p>
        </div>

        <!-- Chapter Text Content Container -->
        <article id="chapterContent" class="prose prose-invert max-w-none text-slate-300 font-serif text-lg leading-relaxed space-y-6">
            <p class="animate-pulse text-slate-500">Loading chapter content from files...</p>
        </article>

        <!-- Chapter Navigation Footer -->
        <div class="mt-16 pt-8 border-t border-white/10 flex items-center justify-between">
            <button onclick="changeChapter(-1)" id="prevBtn" class="px-5 py-2.5 rounded-xl bg-cardBg border border-white/10 text-slate-300 hover:text-white hover:border-purple-500/50 font-semibold text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                Previous Chapter
            </button>
            <span id="chapterIndicator" class="text-xs text-slate-500 font-semibold">Ch. 1</span>
            <button onclick="changeChapter(1)" id="nextBtn" class="px-5 py-2.5 rounded-xl bg-accentPurple hover:bg-purple-700 text-white font-bold text-sm transition-all">
                Next Chapter
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8 mt-16 bg-darkBg text-center text-xs text-slate-500">
        <p>&copy; 2026 SWYPYY. All rights reserved.</p>
    </footer>

    <!-- Script to Load info.txt and Chapter Files -->
    <script>
        lucide.createIcons();

        // Get novel slug from URL parameters e.g., reader.html?novel=just-a-dream
        const urlParams = new URLSearchParams(window.location.search);
        const novelFolder = urlParams.get('novel') || 'just-a-dream';
        
        let currentChapter = 1;
        let totalChapters = 1; // Will try to detect or loop through files

        async function loadNovelData() {
            const basePath = `Assets/novels/${novelFolder}/`;

            try {
                // 1. Fetch info.txt
                const infoResponse = await fetch(basePath + 'info.txt');
                if (infoResponse.ok) {
                    const infoText = await infoResponse.text();
                    parseInfo(infoText);
                } else {
                    document.getElementById('novelTitle').innerText = "Novel Not Found";
                    document.getElementById('chapterContent').innerHTML = "<p>Could not locate info.txt for this novel.</p>";
                    return;
                }

                // 2. Load initial chapter (ch1.txt)
                loadChapter(currentChapter);

            } catch (error) {
                console.error("Error loading novel data:", error);
                document.getElementById('novelTitle').innerText = "Error Loading Content";
                document.getElementById('chapterContent').innerHTML = "<p>Please ensure your folder structure and text files are correctly uploaded to GitHub.</p>";
            }
        }

        // Simple parser for info.txt key-value pairs (e.g. Title: Just A Dream)
        function parseInfo(text) {
            const lines = text.split('\n');
            let title = "Web Novel";
            let genre = "Fiction";

            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const val = parts.slice(1).join(':').trim();
                    if (key === 'title') title = val;
                    if (key === 'genre') genre = val;
                }
            });

            document.getElementById('novelTitle').innerText = title;
            document.getElementById('novelGenre').innerText = genre;
        }

        // Fetch and display specific chapter file (ch1.txt, ch2.txt, etc.)
        async function loadChapter(chapterNum) {
            const basePath = `Assets/novels/${novelFolder}/`;
            const chapterFile = `${basePath}ch${chapterNum}.txt`;

            try {
                const response = await fetch(chapterFile);
                if (response.ok) {
                    const text = formatChapterText(await response.text());
                    document.getElementById('chapterContent').innerHTML = text;
                    document.getElementById('chapterTitle').innerText = `Chapter ${chapterNum}`;
                    document.getElementById('chapterIndicator').innerText = `Ch. ${chapterNum}`;
                    
                    // Update button states
                    document.getElementById('prevBtn').disabled = (chapterNum <= 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    if (chapterNum > 1) {
                        // If next chapter file doesn't exist, cap it
                        currentChapter = chapterNum - 1;
                        alert("You've reached the latest available chapter!");
                    } else {
                        document.getElementById('chapterContent').innerHTML = "<p>Chapter content is currently empty or missing.</p>";
                    }
                }
            } catch (error) {
                console.error("Error loading chapter:", error);
            }
        }

        // Formats raw text paragraphs into clean HTML paragraphs
        function formatChapterText(rawText) {
            return rawText
                .split('\n\n')
                .map(para => `<p>${para.trim().replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function changeChapter(direction) {
            currentChapter += direction;
            if (currentChapter < 1) currentChapter = 1;
            loadChapter(currentChapter);
        }

        // Initialize loader on page start
        loadNovelData();
    </script>
</body>
                    </html>

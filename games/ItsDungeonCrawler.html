<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swypyy // Dungeon Crawler</title>
    <style>
        :root {
            --bg-color: #07060b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        .logo-box {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .loader-track {
            width: 220px;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: var(--accent);
            animation: loadProgress 2s ease forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 100%; }
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #0b0f19;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
        }

        header {
            padding: 12px 15px;
            background: #0f172a;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .dungeon-badge {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid #94a3b8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* --- CANVAS VIEWPORT --- */
        #canvas-box {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05070c;
            position: relative;
        }

        canvas {
            background: #111827;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #1f2937;
        }

        /* --- LOG CONSOLE --- */
        #log-box {
            height: 80px;
            background: #090d16;
            border-top: 1px solid #1f2937;
            padding: 10px 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            overflow-y: auto;
        }

        /* --- CONTROLS --- */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #1f2937;
        }

        .ctrl-btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: var(--accent);
            color: #0f172a;
        }

        .action-btn {
            background: #0369a1;
            border-color: #0284c7;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">Swypyy</div>
        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- Game View -->
    <div id="game-container">
        <header>
            <div>
                <span style="font-weight: bold; color: var(--accent);">E-Rank Dungeon</span>
            </div>
            <div class="dungeon-badge">HP: 100/100</div>
        </header>

        <!-- Canvas for Top-Down Rooms -->
        <div id="canvas-box">
            <canvas id="gameCanvas" width="380" height="380"></canvas>
        </div>

        <div id="log-box">
            > Splash screen cleared.<br>
            > Entered random E-Rank Dungeon. Explore the stone rooms!
        </div>

        <div class="controls">
            <div></div>
            <div class="ctrl-btn" onclick="movePlayer(0, -1)">▲</div>
            <div></div>
            <div class="ctrl-btn" onclick="movePlayer(-1, 0)">◀</div>
            <div class="ctrl-btn action-btn" onclick="triggerAction()">⚔</div>
            <div class="ctrl-btn" onclick="movePlayer(1, 0)">▶</div>
            <div></div>
            <div class="ctrl-btn" onclick="movePlayer(0, 1)">▼</div>
            <div></div>
        </div>
    </div>

    <script>
        // Hide Splash Screen after 2.2 seconds
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                initGame();
            }, 600);
        }, 2200);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Tilemap grid (19x19 for detailed room layout)
        const tileSize = 20;
        const mapSize = 19;

        // 1 = Wall (Stone), 0 = Floor, 2 = Monster, 3 = Chest
        let map = [];
        let player = { x: 9, y: 17 };
        let currentMonster = null;

        function initGame() {
            generateRandomDungeon();
            drawMap();
        }

        function generateRandomDungeon() {
            // Procedurally generate stone walls and rooms
            map = [];
            for (let y = 0; y < mapSize; y++) {
                let row = [];
                for (let x = 0; x < mapSize; x++) {
                    // Outer bounds are walls
                    if (x === 0 || x === mapSize - 1 || y === 0 || y === mapSize - 1) {
                        row.push(1);
                    } else {
                        // Random internal pillars/walls vs open stone rooms
                        let rand = Math.random();
                        if (rand < 0.15 && !(x === 9 && y === 17)) {
                            row.push(1); // Stone wall obstacle
                        } else if (rand < 0.20 && !(x === 9 && y === 17)) {
                            row.push(2); // Monster spawn
                        } else if (rand < 0.23 && !(x === 9 && y === 17)) {
                            row.push(3); // Loot chest
                        } else {
                            row.push(0); // Open floor
                        }
                    }
                }
                map.push(row);
            }
            // Ensure player starting zone is clear
            map[17][9] = 0;
            map[16][9] = 0;
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < mapSize; y++) {
                for (let x = 0; x < mapSize; x++) {
                    let tile = map[y][x];

                    if (tile === 1) {
                        // Stone wall texture look
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = '#0f172a';
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else {
                        // Stone floor tile
                        ctx.fillStyle = '#111827';
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = '#1f2937';
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);

                        if (tile === 2) {
                            // Monster icon on map
                            ctx.font = '14px sans-serif';
                            ctx.fillText('👾', x * tileSize + 2, y * tileSize + 16);
                        } else if (tile === 3) {
                            // Chest icon on map
                            ctx.font = '14px sans-serif';
                            ctx.fillText('📦', x * tileSize + 2, y * tileSize + 16);
                        }
                    }
                }
            }

            // Draw Player
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(player.x * tileSize + tileSize/2, player.y * tileSize + tileSize/2, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function logMessage(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML = `> ${msg}<br>` + box.innerHTML;
        }

        function movePlayer(dx, dy) {
            let newX = player.x + dx;
            let newY = player.y + dy;

            if (newX >= 0 && newX < mapSize && newY >= 0 && newY < mapSize) {
                let targetTile = map[newY][newX];

                if (targetTile === 1) {
                    logMessage("Blocked by a solid stone wall.");
                } else {
                    player.x = newX;
                    player.y = newY;

                    if (targetTile === 2) {
                        currentMonster = { hp: 30 };
                        logMessage("⚠️ Encountered an E-Rank Dungeon Monster! Tap ⚔ to attack.");
                    } else if (targetTile === 3) {
                        map[newY][newX] = 0; // Remove chest
                        logMessage("📦 Opened a loot chest! Found 15 Gold.");
                    } else {
                        logMessage(`Moved to (${newX}, ${newY})`);
                    }

                    drawMap();
                }
            }
        }

        function triggerAction() {
            if (currentMonster) {
                currentMonster.hp -= 15;
                if (currentMonster.hp <= 0) {
                    logMessage("⚔ Slain the monster! Victory rewards collected.");
                    // Clear monster tile from map
                    map[player.y][player.x] = 0;
                    currentMonster = null;
                } else {
                    logMessage(`⚔ Hit monster! Monster HP remaining: ${currentMonster.hp}`);
                }
                drawMap();
            } else {
                logMessage("Nothing to attack here. Look for monsters (👾).");
            }
        }
    </script>
</body>
    </html>

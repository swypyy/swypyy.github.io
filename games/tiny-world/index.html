<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swypyy | Tiny Wilds</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#91d9f4}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #163047}
.panel{background:#102337bb;border:1px solid #ffffff35;border-radius:14px;padding:10px}
#brand{position:absolute;top:14px;left:14px;font-weight:900;letter-spacing:2px}
#stats{position:absolute;top:14px;right:14px;display:flex;gap:8px;font-weight:bold}
#objective{position:absolute;top:75px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px}
#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:12px}
#message{position:absolute;top:28%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:900}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#102337bb;z-index:5;color:white;text-align:center}
.card{background:#102337;padding:28px;border-radius:24px;width:min(420px,90%)}
.card h1{font-size:45px;margin:10px}
.card p{line-height:1.6;color:#d4e8f4}
button{border:0;border-radius:13px;padding:14px 20px;background:#ffe27a;color:#173047;font-weight:900}
#mobile{position:fixed;bottom:20px;left:15px;right:15px;display:none;pointer-events:none}
.pad{position:absolute;bottom:0;left:0;width:140px;height:140px;pointer-events:auto}
.key{position:absolute;width:45px;height:45px;background:#10283bcc;color:white;border:1px solid #ffffff55;border-radius:12px;display:grid;place-items:center;font-weight:bold;touch-action:none}
#up{left:47px;top:0}#down{left:47px;bottom:0}
#left{left:0;top:47px}#right{right:0;top:47px}
#jump{position:absolute;right:5px;bottom:15px;width:65px;height:65px;border-radius:50%;pointer-events:auto}
#run{position:absolute;right:85px;bottom:10px;pointer-events:auto}
@media(pointer:coarse){#mobile{display:block}#hint{bottom:170px}}
</style>
</head>
<body>

<div id="hud">
 <div id="brand" class="panel">SWYPYY<br><small>TINY WILDS</small></div>
 <div id="stats">
  <div class="panel">💎 <span id="score">0</span>/12</div>
  <div class="panel">📍 <span id="area">Meadow</span></div>
 </div>
 <div id="objective" class="panel">Find all 12 sky crystals!</div>
 <div id="message"></div>
 <div id="hint" class="panel">WASD / Arrow keys · Space to jump · Shift to run</div>
</div>

<div id="mobile">
 <div class="pad">
  <div class="key" id="up">▲</div>
  <div class="key" id="down">▼</div>
  <div class="key" id="left">◀</div>
  <div class="key" id="right">▶</div>
 </div>
 <div class="key" id="run">RUN</div>
 <div class="key" id="jump">JUMP</div>
</div>

<div id="start">
 <div class="card">
  <h1>🌴 Tiny Wilds</h1>
  <p>A colourful open world by Swypyy.<br>Explore the island, discover the village and collect 12 sky crystals!</p>
  <p>PC: WASD + Space<br>Mobile: Touch controls</p>
  <button id="play">EXPLORE ISLAND</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d9f4);
scene.fog=new THREE.Fog(0x91d9f4,42,115);

const camera=new THREE.PerspectiveCamera(
62,innerWidth/innerHeight,.1,220
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdaf5ff,0x55704b,2));

const sun=new THREE.DirectionalLight(0xfff3d0,2.5);
sun.position.set(-25,38,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-55;
sun.shadow.camera.right=55;
sun.shadow.camera.top=55;
sun.shadow.camera.bottom=-55;
scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({
 color:c,roughness:1,flatShading:true
});

const grass=mat(0x75c96b);
const darkGrass=mat(0x4d9c5b);
const sand=mat(0xe9d18c);
const world=new THREE.Group();
scene.add(world);

function terrainHeight(x,z){
 const r=Math.sqrt(x*x+z*z);
 return Math.max(0,
  2.3*Math.sin(x*.12)*Math.cos(z*.105)+
  1.4*Math.sin((x+z)*.19)+
  Math.max(0,1-r/43)*3.2
 );
}

// Island
const geo=new THREE.PlaneGeometry(92,92,72,72);
geo.rotateX(-Math.PI/2);

const p=geo.attributes.position;
for(let i=0;i<p.count;i++){
 const x=p.getX(i),z=p.getZ(i);
 p.setY(i,terrainHeight(x,z));
}
geo.computeVertexNormals();

const land=new THREE.Mesh(geo,grass);
land.receiveShadow=true;
world.add(land);

// Ocean and beach
const water=new THREE.Mesh(
 new THREE.CircleGeometry(100,80),
 new THREE.MeshStandardMaterial({color:0x3caecb})
);
water.rotation.x=-Math.PI/2;
water.position.y=-1.7;
world.add(water);

const beach=new THREE.Mesh(
 new THREE.RingGeometry(40,45,80),sand
);
beach.rotation.x=-Math.PI/2;
beach.position.y=-.6;
world.add(beach);

// Hills
for(let i=0;i<18;i++){
 const a=i/18*Math.PI*2;
 const r=47+(i%3)*3;
 const h=5+(i%4)*2;

 const hill=new THREE.Mesh(
  new THREE.ConeGeometry(7,h,6),
  i%2?darkGrass:grass
 );
 hill.position.set(Math.cos(a)*r,h/2-1,Math.sin(a)*r);
 hill.rotation.y=a;
 hill.castShadow=true;
 world.add(hill);
}

// Player
const player=new THREE.Group();
scene.add(player);

const skin=mat(0xffc58f);
const shirt=mat(0xff754f);
const pants=mat(0x355b9a);
const shoe=mat(0x302c3b);
const white=mat(0xffffff);
const black=mat(0x17212c);
const backpack=mat(0x6d4ab5);

function box(parent,w,h,d,m,x,y,z){
 const o=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),m
 );
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

function ball(parent,r,m,x,y,z,sx=1,sy=1,sz=1){
 const o=new THREE.Mesh(
  new THREE.SphereGeometry(r,10,8),m
 );
 o.position.set(x,y,z);
 o.scale.set(sx,sy,sz);
 o.castShadow=true;
 parent.add(o);
 return o;
}

box(player,.68,.72,.38,shirt,0,1.22,0);
ball(player,.34,skin,0,1.85,0,1,1.05,.95);
box(player,.27,.45,.18,backpack,0,1.27,.27);

ball(player,.055,white,-.12,1.9,-.29);
ball(player,.055,white,.12,1.9,-.29);
ball(player,.027,black,-.12,1.9,-.34);
ball(player,.027,black,.12,1.9,-.34);

const legs=[];
for(const x of [-.2,.2]){
 const leg=new THREE.Group();
 leg.position.set(x,.88,0);
 player.add(leg);
 box(leg,.22,.58,.23,pants,0,-.28,0);
 box(leg,.25,.14,.34,shoe,0,-.58,-.04);
 legs.push(leg);
}

const arms=[];
for(const x of [-.43,.43]){
 const arm=new THREE.Group();
 arm.position.set(x,1.48,0);
 player.add(arm);
 box(arm,.18,.48,.19,shirt,0,-.2,0);
 ball(arm,.11,skin,0,-.45,0);
 arms.push(arm);
}

// Crystals
let collected=0;
const crystals=[];
const crystalMat=new THREE.MeshStandardMaterial({
 color:0x6ff5ff,
 emissive:0x19b9df,
 emissiveIntensity:.75,
 roughness:.18
});
const gold=mat(0xffe77a);

const spots=[
 [-18,-12],[12,-18],[24,5],[-26,13],
 [5,27],[-8,5],[31,-15],[-33,-5],
 [17,31],[-15,31],[0,-31],[34,18]
];

for(const [x,z] of spots){
 const g=new THREE.Group();

 const gem=new THREE.Mesh(
  new THREE.OctahedronGeometry(.55,0),
  crystalMat
 );
 gem.scale.y=1.45;
 g.add(gem);

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.72,.045,6,20),
  gold
 );
 ring.rotation.x=Math.PI/2;
 g.add(ring);

 g.position.set(x,terrainHeight(x,z)+1.35,z);
 scene.add(g);
 crystals.push({group:g,active:true});
}

// Trees
const trunkMat=mat(0x8b5937);
const leaves=[
 mat(0x2e9659),
 mat(0x43ad63),
 mat(0x67bd62)
];

function makeTree(x,z,scale=1){
 const g=new THREE.Group();
 g.position.set(x,terrainHeight(x,z),z);
 g.scale.setScalar(scale);

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.32,2.1,6),
  trunkMat
 );
 trunk.position.y=1.05;
 trunk.castShadow=true;
 g.add(trunk);

 for(let j=0;j<3;j++){
  const crown=new THREE.Mesh(
   new THREE.IcosahedronGeometry(1.15-j*.12,0),
   leaves[j]
  );
  crown.position.set((j-1)*.22,2.15+j*.48,0);
  crown.castShadow=true;
  g.add(crown);
 }
 world.add(g);
}

let seed=713;
function rand(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

for(let i=0;i<100;i++){
 const a=rand()*Math.PI*2;
 const r=11+rand()*29;
 const x=Math.cos(a)*r;
 const z=Math.sin(a)*r;

 if(Math.hypot(x,z)<9)continue;

 if(spots.some(([cx,cz])=>
  Math.hypot(cx-x,cz-z)<3
 ))continue;

 makeTree(x,z,.65+rand()*.65);
}

// Village
const houseColors=[
 0xff9c75,0x80c7e8,0xf3d16b,0xc39be8
];

for(let i=0;i<7;i++){
 const a=i/7*Math.PI*2;
 const x=Math.cos(a)*17;
 const z=Math.sin(a)*17;

 const h=new THREE.Group();
 h.position.set(x,terrainHeight(x,z),z);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(3.2,2.4,2.8),
  mat(houseColors[i%4])
 );
 body.position.y=1.2;
 body.castShadow=true;
 h.add(body);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(2.45,1.55,4),
  mat(0x914c42)
 );
 roof.position.y=3.05;
 roof.rotation.y=Math.PI/4;
 h.add(roof);

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(.65,1.25,.08),
  mat(0x68432f)
 );
 door.position.set(0,.63,-1.44);
 h.add(door);

 world.add(h);
}

// Path
const pathPoints=[
 new THREE.Vector3(0,terrainHeight(0,0)+.05,0),
 new THREE.Vector3(5,terrainHeight(5,0)+.05,0),
 new THREE.Vector3(11,terrainHeight(11,3)+.05,3),
 new THREE.Vector3(17,terrainHeight(17,7)+.05,7)
];

const curve=new THREE.CatmullRomCurve3(pathPoints);

const path=new THREE.Mesh(
 new THREE.TubeGeometry(curve,50,.8,6,false),
 mat(0xd9bd82)
);
world.add(path);

// Clouds
const clouds=[];
const cloudMat=mat(0xffffff);

for(let i=0;i<9;i++){
 const c=new THREE.Group();

 for(let j=0;j<4;j++){
  const puff=new THREE.Mesh(
   new THREE.SphereGeometry(1.4,8,6),
   cloudMat
  );
  puff.position.set(j*1.2,Math.sin(j)*.3,0);
  puff.scale.set(1.2,.65,.8);
  c.add(puff);
 }

 c.position.set((i-4)*22,17+(i%3)*3,-35+(i%4)*20);
 scene.add(c);
 clouds.push(c);
}

// Controls
const keys={};

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
  e.preventDefault();
 }
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

function bindHold(id,key){
 const el=document.getElementById(id);

 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
 });

 const off=()=>{
  keys[key]=false;
 };

 el.addEventListener('pointerup',off);
 el.addEventListener('pointercancel',off);
 el.addEventListener('lostpointercapture',off);
}

bindHold('up','w');
bindHold('down','s');
bindHold('left','a');
bindHold('right','d');
bindHold('run','shift');

let vy=0;
let playerY=0;
let grounded=true;
let walkTime=0;

function jump(){
 if(grounded){
  vy=8.5;
  grounded=false;
 }
}

document.getElementById('jump').addEventListener(
 'pointerdown',e=>{
  e.preventDefault();
  jump();
 }
);

function clampIsland(x,z){
 const r=Math.hypot(x,z);
 if(r>39){
  const f=39/r;
  return [x*f,z*f];
 }
 return [x,z];
}

const clock=new THREE.Clock();
const cameraTarget=new THREE.Vector3();
let started=false;
let messageTimer=0;

function showMessage(text){
 const el=document.getElementById('message');
 el.textContent=text;
 messageTimer=2.1;
}

document.getElementById('play').onclick=()=>{
 started=true;
 document.getElementById('start').style.display='none';
 showMessage('Welcome to Tiny Wilds!');
};

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 if(started){
  const forward=
   (keys.w||keys.arrowup?1:0)-
   (keys.s||keys.arrowdown?1:0);

  const side=
   (keys.d||keys.arrowright?1:0)-
   (keys.a||keys.arrowleft?1:0);

  if(keys[' ']||keys.space){
   jump();
   keys[' ']=false;
   keys.space=false;
  }

  const moving=forward!==0||side!==0;
  const speed=keys.shift?10:6.2;

  if(moving){
   const len=Math.hypot(side,forward);
   const dx=side/len;
   const dz=forward/len;

   player.position.x+=dx*speed*dt;
   player.position.z-=dz*speed*dt;

   player.rotation.y=Math.atan2(dx,dz)+Math.PI;
   walkTime+=dt*(keys.shift?15:10);
  }

  [player.position.x,player.position.z]=
   clampIsland(player.position.x,player.position.z);

  const ground=terrainHeight(
   player.position.x,player.position.z
  );

  vy-=21*dt;
  playerY+=vy*dt;

  if(playerY<=ground){
   playerY=ground;
   vy=0;
   grounded=true;
  }

  player.position.y=playerY;

  legs[0].rotation.x=moving?Math.sin(walkTime)*.65:0;
  legs[1].rotation.x=moving?-Math.sin(walkTime)*.65:0;
  arms[0].rotation.x=moving?-Math.sin(walkTime)*.45:0;
  arms[1].rotation.x=moving?Math.sin(walkTime)*.45:0;

  // Collect crystals
  for(const c of crystals){
   if(!c.active)continue;

   c.group.rotation.y+=dt*1.4;

   c.group.position.y=
    terrainHeight(c.group.position.x,c.group.position.z)+
    1.35+Math.sin(t*2+c.group.position.x)*.16;

   if(player.position.distanceTo(c.group.position)<1.65){
    c.active=false;
    c.group.visible=false;
    collected++;

    document.getElementById('score').textContent=collected;

    showMessage(
     collected===12?
     'All crystals found!':
     '+1 SKY CRYSTAL'
    );

    if(collected===12){
     document.getElementById('objective').textContent=
      'You found every crystal. Keep exploring!';
    }
   }
  }

  const d=Math.hypot(player.position.x,player.position.z);

  document.getElementById('area').textContent=
   d<10?'Village':
   d<24?'Meadow':
   d<34?'Forest':'Shore';

  cameraTarget.set(
   player.position.x,
   player.position.y+1.1,
   player.position.z
  );

  const desired=new THREE.Vector3(
   player.position.x+Math.sin(player.rotation.y)*.4,
   player.position.y+7.5,
   player.position.z+12
  );

  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.lookAt(cameraTarget);

  if(messageTimer>0){
   messageTimer-=dt;
   if(messageTimer<=0){
    document.getElementById('message').textContent='';
   }
  }

 }else{
  camera.position.set(0,12,25);
  camera.lookAt(0,1,0);
 }

 clouds.forEach((c,i)=>{
  c.position.x+=dt*(.35+i*.025);
  if(c.position.x>110)c.position.x=-110;
 });

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>

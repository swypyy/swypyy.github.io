<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webnovels | SWYPYY</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#07060b',
                        surface: '#120f1d',
                        'surface-light': '#1c172e',
                        brand: {
                            purple: '#7c3aed',
                            light: '#a78bfa',
                            glow: '#c084fc',
                            accent: '#d8b4fe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        cursive: ['Caveat', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&display=swap');

        body {
            background-color: #07060b;
            color: #f3f4f6;
        }

        .s-logo-handwritten {
            font-family: 'Caveat', cursive;
            line-height: 1;
        }

        .purple-glow-card {
            box-shadow: 0 0 35px -5px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-purple selection:text-white">

    <!-- HEADER WITH LOGO ON TOP & BACK BUTTON BELOW -->
    <header class="sticky top-0 z-40 bg-void/90 backdrop-blur-md border-b border-white/5 py-4">
        <div class="max-w-6xl mx-auto px-6 flex flex-col items-center gap-2">
            
            <!-- TOP: CENTERED BRAND LOGO -->
            <a href="index.html" class="flex items-center group">
                <img src="Assets/logo.png" alt="Swypyy Logo" class="h-10 sm:h-12 w-auto object-contain transition-transform group-hover:scale-105" onerror="this.onerror=null; this.src='assets/logo.png'; this.onerror=function(){this.style.display='none'; document.getElementById('textBrandLogo').style.display='flex';};">
                <div id="textBrandLogo" class="hidden items-center gap-1">
                    <span class="s-logo-handwritten text-4xl font-bold text-brand-purple">S</span>
                    <span class="text-2xl font-bold tracking-wider text-white">wypyy</span>
                </div>
            </a>

            <!-- BOTTOM: CLEAN BACK ARROW (NO OUTLINE, NO TEXT) -->
            <div class="w-full max-w-6xl flex justify-start px-2">
                <a href="index.html" class="text-gray-400 hover:text-brand-glow transition-colors p-1 flex items-center gap-1 text-sm font-medium" aria-label="Back to Home">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
            </div>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow py-16 px-6">
        <div class="max-w-6xl mx-auto space-y-12">
            
            <div class="text-center space-y-3">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-white">My Webnovels</h1>
                <p class="text-gray-400">Original serials & stories written by Swypyy</p>
            </div>

            <!-- NOVELS GRID -->
            <div class="max-w-xs mx-auto sm:max-w-none grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-8">
                
                <!-- NOVEL CARD 1: JUST A DREAM -->
                <div onclick="openComingSoonModal('Just A Dream')" class="group cursor-pointer flex flex-col gap-3">
                    <!-- Cover Image -->
                    <div class="w-full aspect-[3/4] bg-surface-light rounded-2xl border border-white/10 overflow-hidden relative shadow-xl group-hover:border-brand-purple/60 group-hover:shadow-brand-purple/20 transition-all duration-300">
                        <img src="Assets/Novel-cover/Just-A-Dream.png" alt="Just A Dream Cover" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='assets/Novel-cover/Just-A-Dream.png';">
                        <!-- Dark overlay on hover -->
                        <div class="absolute inset-0 bg-brand-purple/0 group-hover:bg-brand-purple/10 transition-colors duration-300"></div>
                    </div>
                    <!-- Title -->
                    <div class="text-left px-1">
                        <h2 class="text-base sm:text-lg font-bold text-white group-hover:text-brand-glow transition-colors">Just A Dream</h2>
                        <p class="text-xs text-gray-400">Chapter 1 coming soon</p>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-8 border-t border-white/5 bg-void text-center text-gray-500 text-xs">
        <div class="max-w-6xl mx-auto px-6">
            <p>&copy; 2026 SWYPYY. All rights reserved.</p>
        </div>
    </footer>

    <!-- COMING SOON POPUP MODAL -->
    <div id="comingSoonModal" class="fixed inset-0 bg-void/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-surface border border-brand-purple/40 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center space-y-6 purple-glow-card relative transform transition-all scale-100">
            
            <!-- CLOSE BUTTON (X) -->
            <button onclick="closeComingSoonModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white p-1 focus:outline-none">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <!-- ICON & TITLE -->
            <div class="space-y-3 pt-2">
                <div class="w-16 h-16 mx-auto rounded-full bg-brand-purple/20 border border-brand-purple/40 flex items-center justify-center text-brand-glow">
                    <i data-lucide="clock" class="w-8 h-8 animate-pulse"></i>
                </div>
                <h3 id="modalNovelTitle" class="text-2xl font-extrabold text-white">Just A Dream</h3>
                <span class="inline-block px-3 py-1 rounded-full bg-brand-purple/20 text-brand-light text-xs font-semibold uppercase tracking-wider border border-brand-purple/30">
                    Coming Soon
                </span>
            </div>

            <!-- DESCRIPTION -->
            <p class="text-gray-300 text-sm leading-relaxed">
                This webnovel is currently being written. Stay tuned for chapters releasing soon!
            </p>

            <!-- COUNTDOWN TIMER & ACTION BUTTON -->
            <div class="space-y-4 pt-2">
                <div class="text-xs text-brand-light font-medium bg-surface-light py-2 px-4 rounded-xl border border-white/5 inline-block">
                    Auto-closing in <span id="countdownNumber" class="font-bold text-white text-sm">5</span>s...
                </div>

                <div>
                    <button onclick="closeComingSoonModal()" class="w-full py-3 rounded-xl bg-brand-purple hover:bg-brand-glow text-white font-semibold transition-all shadow-md">
                        Close
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // Modal & 5-Second Countdown Logic
        let countdownTimer = null;
        let timeLeft = 5;

        function openComingSoonModal(novelTitle) {
            document.getElementById('modalNovelTitle').innerText = novelTitle;
            
            const modal = document.getElementById('comingSoonModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // Reset and start countdown from 5
            timeLeft = 5;
            document.getElementById('countdownNumber').innerText = timeLeft;

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdownNumber').innerText = timeLeft;

                if (timeLeft <= 0) {
                    closeComingSoonModal();
                }
            }, 1000);
        }

        function closeComingSoonModal() {
            clearInterval(countdownTimer);
            const modal = document.getElementById('comingSoonModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
            </html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Novels - SWYPYY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0b0e',
                        cardBg: '#13131a',
                        accentRed: '#e11d48',
                        accentPurple: '#7c3aed',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0b0e;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-purple-600 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="w-full border-b border-white/10 bg-darkBg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-900/30 group-hover:scale-105 transition-transform">
                    <span class="text-white font-extrabold text-lg">S</span>
                </div>
                <span class="font-extrabold text-xl tracking-wider text-white">SWYPYY</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="novels.html" class="text-white font-semibold">My Novels</a>
                <a href="index.html#about" class="hover:text-white transition-colors">About Me</a>
                <a href="index.html#contact" class="hover:text-white transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Back Button directly under the header with zero gap -->
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4">
        <a href="index.html" class="inline-flex items-center text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
    </div>

    <!-- Main Library Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white">My Web Novels</h1>
            <p class="text-sm text-slate-400 mt-1">Explore my published and ongoing serialized web novels.</p>
        </div>

        <!-- Novels Grid (2 cols on mobile, 4 cols on PC) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- Novel Card: Just A Dream -->
            <div onclick="openReader('Just A Dream')" class="group cursor-pointer bg-cardBg rounded-2xl p-3 border border-white/10 hover:border-purple-500/50 transition-all duration-300 flex flex-col shadow-xl">
                <div class="aspect-[3/4] w-full overflow-hidden rounded-xl bg-black/40 relative">
                    <img src="Assets/Novel-cover/Just-A-Dream.png" alt="Just A Dream Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="mt-3 px-1">
                    <h3 class="font-bold text-white text-base truncate group-hover:text-purple-400 transition-colors">Just A Dream</h3>
                </div>
            </div>

            <!-- Future novel cards will automatically slot in right here next to it -->

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8 mt-12 bg-darkBg text-center text-xs text-slate-500">
        <p>&copy; 2026 SWYPYY. All rights reserved.</p>
    </footer>

    <!-- Reader Modal / Placeholder Logic -->
    <script>
        lucide.createIcons();

        function openReader(novelTitle) {
            // Placeholder for when you link to the reader or external site later
            alert("Opening reader for: " + novelTitle);
        }
    </script>
</body>
                </html>
